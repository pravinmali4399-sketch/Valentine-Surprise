<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scam!!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background:
    radial-gradient(circle at top, #ff9a9e, transparent 45%),
    radial-gradient(circle at bottom, #fad0c4, transparent 45%),
    linear-gradient(135deg, #ff4e50, #f9d423);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  color: white;
  transition: background 0.4s ease;
}

/* Calm final background */
.calm {
  background:
    radial-gradient(circle at top, #fbc2eb, transparent 50%),
    linear-gradient(135deg, #a18cd1, #fbc2eb);
}

/* Flash */
.flash {
  background:
    radial-gradient(circle at center, #ffffff, transparent 60%),
    linear-gradient(135deg, #ff0000, #ff9900) !important;
}

/* Card */
.card {
  width: 360px;
  padding: 42px 30px;
  border-radius: 26px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  box-shadow: 0 30px 90px rgba(0,0,0,0.5);
  text-align: center;
  animation: enter 0.7s ease;
}

@keyframes enter {
  from { transform: scale(0.9) translateY(30px); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

h1 { margin-bottom: 12px; font-weight: 600; }
p { font-size: 14px; opacity: 0.9; margin-bottom: 18px; }

/* Countdown */
#countdown {
  display: none;
  font-size: 15px;
  font-weight: 600;
}
#countdown.red { color: #ff2e2e; }

/* Shake */
.shake {
  animation: shake 0.4s infinite;
}
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* Buttons */
.buttons {
  position: relative;
  height: 140px;
}

button {
  padding: 14px 34px;
  font-size: 16px;
  border-radius: 999px;
  border: none;
  font-weight: 600;
}

.primary {
  background: linear-gradient(135deg, #00f260, #0575e6);
  color: white;
}

.danger {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: white;
}

/* No button */
#noBtn {
  position: absolute;
  left: 180px;
  top: 60px;
  pointer-events: none;
  display: none;
}

.hidden { display: none; }

/* Final */
.ring {
  font-size: 70px;
  margin-bottom: 10px;
  animation: ringPop 1.2s ease forwards;
}
@keyframes ringPop {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.4); opacity: 1; }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- Risk -->
<div class="card" id="riskBox">
  <h1>⚠️ Warning</h1>
  <p>You might get <b>SCAMMED</b> 😬</p>
  <button class="primary" id="riskBtn">I Understand</button>
</div>

<!-- Questions -->
<div class="card hidden" id="questionBox">
  <h1 id="titleText"></h1>
  <p id="questionText"></p>

  <p id="countdown">
    ⏳ Waiting for decision… <span id="time">15</span>
  </p>

  <div class="buttons">
    <button id="yesBtn" class="primary">Yes ❤️</button>
    <button id="noBtn" class="danger">No 💔</button>
  </div>
</div>

<!-- Final -->
<div class="card hidden" id="finalBox">
  <div class="ring">💍</div>
  <h1>Congratulations 😌</h1>
  <p>
    Nakshatra 💕<br>
    You’re officially <b>SCAMMED</b> for life 💍❤️<br><br>
    <!-- And I wouldn’t want it any other way 🙂 -->
  </p>
</div>

<audio id="finalSound">
  <source src="Coffin-dance.mp3" type="audio/mpeg">
</audio>

<script>
const steps = [
  { title: "Hey Nakshatra 💖", text: "Will you be my Valentine?" },
  { title: "Wait… 😌", text: "Are you really sure?" },
  { title: "Try to say No..😌", text: "Last chance to escape…" }
];

let step = 0;
let timer;
let timeLeft = 15;

const body = document.body;
const riskBox = document.getElementById("riskBox");
const questionBox = document.getElementById("questionBox");
const finalBox = document.getElementById("finalBox");
const titleText = document.getElementById("titleText");
const questionText = document.getElementById("questionText");
const countdown = document.getElementById("countdown");
const timeSpan = document.getElementById("time");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const finalSound = document.getElementById("finalSound");
const container = document.querySelector(".buttons");

/* Typing effect */
function typeText(el, text, speed = 40) {
  el.innerHTML = "";
  let i = 0;
  const t = setInterval(() => {
    el.innerHTML += text[i++];
    if (i >= text.length) clearInterval(t);
  }, speed);
}

/* Start */
riskBtn.onclick = () => {
  riskBox.classList.add("hidden");
  questionBox.classList.remove("hidden");
  typeText(titleText, steps[0].title);
  typeText(questionText, steps[0].text, 30);
};

/* Move NO */
function moveNo() {
  noBtn.style.left = Math.random() * (container.clientWidth - noBtn.offsetWidth) + "px";
  noBtn.style.top = Math.random() * (container.clientHeight - noBtn.offsetHeight) + "px";
}

document.addEventListener("mousemove", e => {
  if (step === 2) moveNo();
});

/* Countdown */
function startCountdown() {
  countdown.style.display = "block";
  timeLeft = 15;
  timeSpan.textContent = timeLeft;

  timer = setInterval(() => {
    timeLeft--;
    timeSpan.textContent = timeLeft;

    if (timeLeft <= 10) countdown.classList.add("red");
    if (timeLeft <= 8) questionBox.classList.add("shake");
    if (timeLeft <= 3 && timeLeft > 0) {
      countdown.innerHTML = "Deciding for you… <span id='time'>" + timeLeft + "</span>";
      body.classList.add("flash");
      setTimeout(() => body.classList.remove("flash"), 200);
    }

    if (timeLeft <= 0) {
      clearInterval(timer);
      yesBtn.click();
    }
  }, 1000);
}

/* YES */
yesBtn.onclick = () => {
  step++;
  if (step < steps.length) {
    typeText(titleText, steps[step].title);
    typeText(questionText, steps[step].text, 30);

    if (step === 2) {
      yesBtn.style.display = "none";
      noBtn.style.display = "inline-block";
      startCountdown();
    }
  } else {
    body.classList.add("calm");
    questionBox.classList.add("hidden");
    finalBox.classList.remove("hidden");
    finalSound.volume = 0;
    finalSound.play();
    let v = 0;
    const fade = setInterval(() => {
      v += 0.05;
      finalSound.volume = v;
      if (v >= 1) clearInterval(fade);
    }, 200);
  }
};
</script>

</body>
</html>
