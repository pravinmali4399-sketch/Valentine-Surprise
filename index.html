<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scam!!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    background:
      radial-gradient(circle at top, #ff9a9e, transparent 40%),
      radial-gradient(circle at bottom, #fad0c4, transparent 40%),
      linear-gradient(135deg, #ff4e50, #f9d423);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    color: white;
  }

  .card {
    width: 360px;
    padding: 40px 30px;
    border-radius: 24px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
      0 25px 60px rgba(0,0,0,0.35),
      inset 0 0 0 1px rgba(255,255,255,0.25);
    text-align: center;
    animation: pop 0.8s ease;
    position: relative;
    z-index: 2;
  }

  @keyframes pop {
    from { transform: scale(0.8) translateY(40px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }

  h1 {
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: 0.4px;
  }

  p {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 28px;
  }

  .buttons {
    position: relative;
    height: 150px;
  }

  button {
    padding: 14px 30px;
    font-size: 16px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.25s ease;
  }

  #yesBtn {
    background: linear-gradient(135deg, #00f260, #0575e6);
    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  }

  #yesBtn:hover {
    transform: translateY(-2px) scale(1.04);
  }

  #noBtn {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: white;
    position: absolute;
    left: 160px;
    top: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  }

  .final {
    display: none;
  }

  /* floating hearts */
  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: float 6s linear infinite;
    opacity: 0.7;
  }

  @keyframes float {
    to {
      transform: translateY(-110vh) rotate(20deg);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="card" id="questionBox">
  <h1>Will you be my Valentine? 💖</h1>
  <p>pls try to say NO 😏</p>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
  </div>
</div>

<div class="card final" id="finalBox">
  <h1>Congratulations 🎉</h1>
  <p>You’re scammed for life 💍❤️</p>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const questionBox = document.getElementById("questionBox");
  const finalBox = document.getElementById("finalBox");

  function escape() {
    const x = Math.random() * 230;
    const y = Math.random() * 110;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseover", escape);
  noBtn.addEventListener("touchstart", escape);

  yesBtn.addEventListener("click", () => {
    questionBox.style.display = "none";
    finalBox.style.display = "block";
  });

  // hearts
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤️";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (18 + Math.random() * 18) + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }, 450);
</script>

</body>
</html>
