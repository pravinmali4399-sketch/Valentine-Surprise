<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scam!!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background:
    radial-gradient(circle at top, #ff9a9e, transparent 45%),
    radial-gradient(circle at bottom, #fad0c4, transparent 45%),
    linear-gradient(135deg, #ff4e50, #f9d423);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  color: white;
  transition: background 0.3s ease;
}

/* FLASH EFFECT */
.flash {
  background:
    radial-gradient(circle at center, #ffffff, transparent 60%),
    linear-gradient(135deg, #ff0000, #ff9900) !important;
}

/* CARD */
.card {
  width: 360px;
  padding: 42px 30px;
  border-radius: 26px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  box-shadow:
    0 0 30px rgba(255,255,255,0.35),
    0 30px 90px rgba(0,0,0,0.5);
  text-align: center;
  animation: enter 0.8s ease;
}

@keyframes enter {
  from { transform: scale(0.9) translateY(40px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}

h1 { margin-bottom: 12px; font-weight: 600; }
p  { font-size: 14px; opacity: 0.9; margin-bottom: 18px; }

/* COUNTDOWN */
#countdown {
  display: none;
  font-size: 16px;
  font-weight: 600;
}

#countdown.red {
  color: #ff2e2e;
}

/* SHAKE */
.shake {
  animation: shake 0.4s infinite;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* BUTTONS */
.buttons {
  position: relative;
  height: 140px;
}

button {
  padding: 14px 34px;
  font-size: 16px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.primary {
  background: linear-gradient(135deg, #00f260, #0575e6);
  color: white;
  box-shadow: 0 0 22px rgba(0,242,96,0.9);
}

.danger {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: white;
}

/* NO button */
#noBtn {
  position: absolute;
  left: 180px;
  top: 60px;
  pointer-events: none;
  display: none;
}

/* HIDE */
.hidden { display: none; }

/* FINAL */
.ring {
  font-size: 70px;
  margin-bottom: 10px;
  animation: ringPop 1.2s ease forwards;
}

@keyframes ringPop {
  0% { transform: scale(0) rotate(-45deg); opacity: 0; }
  70% { transform: scale(1.4) rotate(10deg); opacity: 1; }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<!-- RISK PAGE -->
<div class="card" id="riskBox">
  <h1>⚠️ Warning</h1>
  <p>
    Please click the button below at your own risk 😬<br>
    You might get <b>SCAMMED</b> 💀
  </p>
  <button class="primary" id="riskBtn">I Understand</button>
</div>

<!-- QUESTIONS -->
<div class="card hidden" id="questionBox">
  <h1>Bubbhu 🐶</h1>
  <p id="questionText"></p>

  <p id="countdown">
    ⏳ Auto selecting YES in <span id="time">15</span> sec
  </p>

  <div class="buttons">
    <button id="yesBtn" class="primary">Yes ❤️</button>
    <button id="noBtn" class="danger">No 💔</button>
  </div>
</div>

<!-- FINAL -->
<div class="card hidden" id="finalBox">
  <div class="ring">💍</div>
  <h1>Congratulations 🎉</h1>
  <p>
    Nakshatra,<br>
    you’re officially <b>SCAMMED</b> for life 💍❤️<br><br>
  </p>
</div>

<audio id="finalSound">
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<script>
const questions = [
  "Will you be my Valentine? 💖",
  "Are you really sure? 🥺💞",
  "Last chance to escape -->💍"
];

let step = 0;
let timer;
let timeLeft = 15;

const body = document.body;
const riskBox = document.getElementById("riskBox");
const riskBtn = document.getElementById("riskBtn");

const questionBox = document.getElementById("questionBox");
const questionText = document.getElementById("questionText");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const countdown = document.getElementById("countdown");
const timeSpan = document.getElementById("time");
const finalBox = document.getElementById("finalBox");
const finalSound = document.getElementById("finalSound");
const container = document.querySelector(".buttons");

/* RISK PAGE */
riskBtn.onclick = () => {
  riskBox.classList.add("hidden");
  questionBox.classList.remove("hidden");
  questionText.innerHTML = questions[step];
};

/* MOVE NO */
function moveNo() {
  const maxX = container.clientWidth - noBtn.offsetWidth;
  const maxY = container.clientHeight - noBtn.offsetHeight;
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top  = Math.random() * maxY + "px";
}

/* NO ESCAPE */
document.addEventListener("mousemove", e => {
  if (step !== 2) return;
  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 120) moveNo();
});

/* START COUNTDOWN */
function startCountdown() {
  countdown.style.display = "block";
  timeLeft = 15;
  timeSpan.textContent = timeLeft;

  timer = setInterval(() => {
    timeLeft--;
    timeSpan.textContent = timeLeft;

    // RED at last 10
    if (timeLeft <= 10) countdown.classList.add("red");

    // SHAKE + VIBRATE at last 5
    if (timeLeft <= 5) {
      questionBox.classList.add("shake");
      if (navigator.vibrate) navigator.vibrate(200);
    }

    // FLASH at 3,2,1
    if (timeLeft <= 3 && timeLeft > 0) {
      body.classList.add("flash");
      setTimeout(() => body.classList.remove("flash"), 200);
    }

    if (timeLeft <= 0) {
      clearInterval(timer);
      yesBtn.click();
    }
  }, 1000);
}

/* YES */
yesBtn.onclick = () => {
  step++;

  if (step < questions.length) {
    questionText.innerHTML = questions[step];

    if (step === 2) {
      noBtn.style.display = "inline-block";
      startCountdown();
    }
  } else {
    clearInterval(timer);
    questionBox.classList.add("hidden");
    finalBox.classList.remove("hidden");
    finalSound.play();
  }
};
</script>

</body>
</html>
