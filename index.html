<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scam!!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background:
    radial-gradient(circle at top, #ff9a9e, transparent 45%),
    radial-gradient(circle at bottom, #fad0c4, transparent 45%),
    linear-gradient(135deg, #ff4e50, #f9d423);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  color: white;
}

/* CARD */
.card {
  width: 360px;
  padding: 42px 30px;
  border-radius: 26px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  box-shadow:
    0 0 30px rgba(255,255,255,0.35),
    0 30px 90px rgba(0,0,0,0.5);
  text-align: center;
  animation: enter 0.8s ease, glow 2.5s infinite alternate;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

@keyframes enter {
  from { transform: scale(0.9) translateY(40px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}

@keyframes glow {
  from { box-shadow: 0 0 18px rgba(255,255,255,0.25), 0 30px 80px rgba(0,0,0,0.45); }
  to   { box-shadow: 0 0 45px rgba(255,255,255,0.6), 0 30px 80px rgba(0,0,0,0.45); }
}

h1 {
  margin-bottom: 10px;
  font-weight: 600;
}

p {
  font-size: 14px;
  opacity: 0.9;
  margin-bottom: 28px;
}

/* BUTTON AREA */
.buttons {
  position: relative;
  height: 140px;
}

button {
  padding: 14px 34px;
  font-size: 16px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.2s ease;
}

button:active {
  transform: scale(0.95);
}

#yesBtn {
  background: linear-gradient(135deg, #00f260, #0575e6);
  color: white;
  box-shadow: 0 0 22px rgba(0,242,96,0.9);
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 12px rgba(0,242,96,0.6); }
  100% { box-shadow: 0 0 32px rgba(0,242,96,1); }
}

#noBtn {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: white;
  position: absolute;
  left: 180px;
  top: 60px;
  pointer-events: none; /* cannot click */
}

/* FINAL SCREEN */
.final {
  display: none;
}

.ring {
  font-size: 70px;
  margin-bottom: 8px;
  animation: ringPop 1.2s ease forwards;
}

@keyframes ringPop {
  0%   { transform: scale(0) rotate(-45deg); opacity: 0; }
  70%  { transform: scale(1.4) rotate(10deg); opacity: 1; }
  100% { transform: scale(1); }
}

/* FLOATING HEARTS */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 18px;
  opacity: 0.75;
  animation: float 7s linear infinite;
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(15deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card" id="questionBox">
  <h1>Bubbhu 🐶💖</h1>
  <p>Will you be my Valentine?<br>Plzz try to say NO 😏</p>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
  </div>
</div>

<div class="card final" id="finalBox">
  <div class="ring">💍</div>
  <h1>Congratulations 🎉</h1>
  <p>
    Nakshatra,<br>
    you’re officially <b>SCAMMED</b> for life 💍❤️<br>
    Happy Valentine’s 💕
  </p>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const questionBox = document.getElementById("questionBox");
const finalBox = document.getElementById("finalBox");
const container = document.querySelector(".buttons");

/* Move NO inside card */
function moveNo() {
  const maxX = container.clientWidth - noBtn.offsetWidth;
  const maxY = container.clientHeight - noBtn.offsetHeight;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top  = Math.random() * maxY + "px";
}

/* Desktop */
document.addEventListener("mousemove", (e) => {
  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top  + r.height / 2;
  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 120) moveNo();
});

/* Mobile */
document.addEventListener("touchstart", moveNo, { passive: true });

/* YES */
yesBtn.addEventListener("click", () => {
  questionBox.style.opacity = "0";
  questionBox.style.transform = "scale(0.95)";
  setTimeout(() => {
    questionBox.style.display = "none";
    finalBox.style.display = "block";
  }, 300);
});

/* Floating hearts */
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤️";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (14 + Math.random() * 14) + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 7000);
}, 800);
</script>

</body>
</html>
