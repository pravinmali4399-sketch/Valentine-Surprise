<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scam!!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    color: #fff;
  }

  .card {
    background: rgba(0,0,0,0.3);
    padding: 35px;
    border-radius: 18px;
    text-align: center;
    width: 340px;
    position: relative;
    z-index: 2;
  }

  h1 {
    margin-bottom: 10px;
  }

  p {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 25px;
  }

  .buttons {
    position: relative;
    height: 140px;
  }

  button {
    padding: 12px 26px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
  }

  #yesBtn {
    background: #2ecc71;
    color: white;
  }

  #noBtn {
    background: #e74c3c;
    color: white;
    position: absolute;
    left: 140px;
    top: 0;
  }

  .final {
    display: none;
  }

  /* HEARTS */
  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
  }

  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
  }

  /* CONFETTI */
  .confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    background: yellow;
    animation: fall 3s linear forwards;
    top: -10px;
  }

  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>

<body>

<div class="card" id="questionBox">
  <h1>Will you be my Valentine? 💖</h1>
  <p>pls try to say NO 😏</p>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
  </div>
</div>

<div class="card final" id="finalBox">
  <h1>Congratulations 🎉</h1>
  <p>You’re scammed for life 💍❤️</p>
</div>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
  const girlName = "My Love"; // 👉 change name here
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const questionBox = document.getElementById("questionBox");
  const finalBox = document.getElementById("finalBox");
  const music = document.getElementById("music");

  let speed = 250;

  function moveNoButton() {
    const x = Math.random() * speed;
    const y = Math.random() * 100;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    speed = Math.max(80, speed - 15); // faster every time
  }

  noBtn.addEventListener("mouseover", moveNoButton);
  noBtn.addEventListener("touchstart", moveNoButton);

  yesBtn.addEventListener("click", () => {
    music.play();
    questionBox.style.display = "none";
    finalBox.style.display = "block";
    launchConfetti();
  });

  // HEARTS
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 20) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 500);

  // CONFETTI
  function launchConfetti() {
    for (let i = 0; i < 120; i++) {
      const conf = document.createElement("div");
      conf.className = "confetti";
      conf.style.left = Math.random() * 100 + "vw";
      conf.style.background = `hsl(${Math.random()*360},100%,50%)`;
      conf.style.animationDuration = (2 + Math.random() * 2) + "s";
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 3000);
    }
  }
</script>

</body>
</html>
