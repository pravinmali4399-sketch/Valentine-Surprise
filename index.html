<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scam!!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background:
    radial-gradient(circle at top, #ff9a9e, transparent 45%),
    radial-gradient(circle at bottom, #fad0c4, transparent 45%),
    linear-gradient(135deg, #ff4e50, #f9d423);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  color: white;
}

.card {
  width: 360px;
  padding: 42px 30px;
  border-radius: 26px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  box-shadow:
    0 0 25px rgba(255, 255, 255, 0.35),
    0 30px 80px rgba(0,0,0,0.45);
  text-align: center;
  animation: pop 0.9s ease, glow 2.5s infinite alternate;
  position: relative;
  transform-style: preserve-3d;
}

@keyframes pop {
  from { transform: scale(0.85) translateY(50px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}

@keyframes glow {
  from { box-shadow: 0 0 20px rgba(255,255,255,0.3), 0 30px 80px rgba(0,0,0,0.45); }
  to   { box-shadow: 0 0 45px rgba(255,255,255,0.6), 0 30px 80px rgba(0,0,0,0.45); }
}

h1 {
  margin-bottom: 12px;
  font-weight: 600;
}

p {
  font-size: 14px;
  opacity: 0.9;
  margin-bottom: 30px;
}

.buttons {
  position: relative;
  height: 150px;
}

button {
  padding: 14px 34px;
  font-size: 16px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.25s ease;
}

#yesBtn {
  background: linear-gradient(135deg, #00f260, #0575e6);
  color: white;
  box-shadow: 0 0 18px rgba(0, 242, 96, 0.8);
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 12px rgba(0,242,96,0.6); }
  100% { box-shadow: 0 0 28px rgba(0,242,96,1); }
}

#yesBtn:hover {
  transform: translateY(-2px) scale(1.05);
}

#noBtn {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: white;
  position: absolute;
  left: 160px;
  top: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}

.final {
  display: none;
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 22px;
  animation: float 6s linear infinite;
  opacity: 0.75;
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(20deg);
    opacity: 0;
  }
}

/* Ring animation */
.ring {
  font-size: 70px;
  animation: ringPop 1.2s ease forwards;
}

@keyframes ringPop {
  0% { transform: scale(0) rotate(-45deg); opacity: 0; }
  70% { transform: scale(1.3) rotate(10deg); opacity: 1; }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="card" id="questionBox">
  <h1>Nakshatra 💖</h1>
  <p>Will you be my Valentine?<br>pls try to say NO 😏</p>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
  </div>
</div>

<div class="card final" id="finalBox">
  <div class="ring">💍</div>
  <h1>Congratulations 🎉</h1>
  <p>
    Nakshatra,<br>
    you’re officially scammed for life 💍❤️<br>
    Happy Valentine’s 💕
  </p>
</div>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const questionBox = document.getElementById("questionBox");
const finalBox = document.getElementById("finalBox");
const music = document.getElementById("music");

// Evil NO button
function ultraEscape(e) {
  const btnRect = noBtn.getBoundingClientRect();
  const distance = Math.hypot(
    e.clientX - (btnRect.left + btnRect.width / 2),
    e.clientY - (btnRect.top + btnRect.height / 2)
  );

  if (distance < 120) {
    const maxX = window.innerWidth - btnRect.width - 20;
    const maxY = window.innerHeight - btnRect.height - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.transform = `rotate(${Math.random() * 360}deg)`;
  }
}

document.addEventListener("mousemove", ultraEscape);
document.addEventListener("touchmove", ultraEscape);

// YES click
yesBtn.addEventListener("click", () => {
  music.play();
  questionBox.style.display = "none";
  finalBox.style.display = "block";
});

// Floating hearts
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤️";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (18 + Math.random() * 18) + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 450);

// iPhone-style motion
document.addEventListener("mousemove", e => {
  const x = (window.innerWidth / 2 - e.clientX) / 30;
  const y = (window.innerHeight / 2 - e.clientY) / 30;
  document.querySelectorAll(".card").forEach(c => {
    c.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
  });
});
</script>

</body>
</html>
