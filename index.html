<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scam!!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background:
    radial-gradient(circle at top, #ff9a9e, transparent 45%),
    radial-gradient(circle at bottom, #fad0c4, transparent 45%),
    linear-gradient(135deg, #ff4e50, #f9d423);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
  color: white;
}

/* CARD */
.card {
  width: 360px;
  padding: 42px 30px;
  border-radius: 26px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  box-shadow:
    0 0 30px rgba(255,255,255,0.35),
    0 30px 90px rgba(0,0,0,0.5);
  text-align: center;
  animation: enter 0.8s ease;
}

@keyframes enter {
  from { transform: scale(0.9) translateY(40px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}

h1 { margin-bottom: 10px; font-weight: 600; }

p {
  font-size: 14px;
  opacity: 0.9;
  margin-bottom: 18px;
}

/* COUNTDOWN */
#countdown {
  display: none;
  font-size: 14px;
  margin-bottom: 22px;
  opacity: 0.9;
}

/* BUTTON AREA */
.buttons {
  position: relative;
  height: 140px;
}

button {
  padding: 14px 34px;
  font-size: 16px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.2s ease;
}

button:active {
  transform: scale(0.95);
}

#yesBtn {
  background: linear-gradient(135deg, #00f260, #0575e6);
  color: white;
  box-shadow: 0 0 22px rgba(0,242,96,0.9);
}

#noBtn {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: white;
  position: absolute;
  left: 180px;
  top: 60px;
  pointer-events: none; /* NOT CLICKABLE */
  display: none;
}

/* FINAL */
.final {
  display: none;
}

.ring {
  font-size: 70px;
  margin-bottom: 10px;
  animation: ringPop 1.2s ease forwards;
}

@keyframes ringPop {
  0% { transform: scale(0) rotate(-45deg); opacity: 0; }
  70% { transform: scale(1.4) rotate(10deg); opacity: 1; }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="card" id="questionBox">
  <h1>Bubbhu 🐶💖</h1>
  <p id="questionText"></p>

  <p id="countdown">
    Auto selecting YES in <b><span id="time">100</span></b> seconds ⏳
  </p>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 💔</button>
  </div>
</div>

<div class="card final" id="finalBox">
  <div class="ring">💍</div>
  <h1>Congratulations 🎉</h1>
  <p>
    Nakshatra,<br>
    you’re officially <b>SCAMMED</b> for life 💍❤️<br>
    Happy Valentine’s 💕
  </p>
</div>

<script>
const questions = [
  "Will you be my Valentine? 💖",
  "Are you really sure? 🥺💞",
  "Last chance to escape… 😈💍"
];

let step = 0;
let timer = null;
let timeLeft = 100;

const questionText = document.getElementById("questionText");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const countdown = document.getElementById("countdown");
const timeSpan = document.getElementById("time");
const questionBox = document.getElementById("questionBox");
const finalBox = document.getElementById("finalBox");
const container = document.querySelector(".buttons");

/* INIT */
questionText.innerHTML = questions[step];

/* MOVE NO inside card */
function moveNo() {
  const maxX = container.clientWidth - noBtn.offsetWidth;
  const maxY = container.clientHeight - noBtn.offsetHeight;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top  = Math.random() * maxY + "px";
}

/* NO ESCAPE ONLY ON STEP 3 */
document.addEventListener("mousemove", (e) => {
  if (step !== 2) return;

  const r = noBtn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top  + r.height / 2;

  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 120) {
    moveNo();
  }
});

document.addEventListener("touchstart", () => {
  if (step === 2) moveNo();
}, { passive: true });

/* START COUNTDOWN */
function startCountdown() {
  countdown.style.display = "block";
  timeLeft = 100;
  timeSpan.textContent = timeLeft;

  timer = setInterval(() => {
    timeLeft--;
    timeSpan.textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timer);
      yesBtn.click(); // AUTO YES
    }
  }, 1000);
}

/* YES CLICK */
yesBtn.addEventListener("click", () => {
  step++;

  if (step < questions.length) {
    questionText.style.opacity = "0";

    setTimeout(() => {
      questionText.innerHTML = questions[step];
      questionText.style.opacity = "1";

      if (step === 2) {
        noBtn.style.display = "inline-block";
        startCountdown();
      }
    }, 200);

  } else {
    clearInterval(timer);
    questionBox.style.display = "none";
    finalBox.style.display = "block";
  }
});
</script>

</body>
</html>
